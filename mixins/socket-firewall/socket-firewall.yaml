# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Socket Firewall
description: >-
  Socket Firewall (sfw) installed in the sandbox, with shell functions that
  route npm, npx, pnpm, yarn, uv, pip, pip3 and cargo through sfw so package
  installs are checked before they run. Free tier: no API key required.
  Go commands (go get / go install / go mod) are intentionally NOT wrapped:
  Socket Firewall Free does not scan Go modules.
sourceUrl: https://github.com/SocketDev/sfw-free
licenses: [Apache-2.0]
version: "1.0.0"

args:
  version:
    default: "2.0.6"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: sfw (Socket Firewall) npm release to install
    buildArg: SFW_VERSION

provides: ["sfw@${{ kit.args.version }}"]

# The sfw npm wrapper is a Node script, so the composed workload must supply
# Node.js (both bases in this repo provide a pinned node@).
requires: ["node >= 20.0.0"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # sfw's first run downloads its prebuilt binary from GitHub releases.
          - github.com
          - api.github.com
          - "*.githubusercontent.com"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Append sfw wrapper functions to the persistent shell environment.
        # /etc/sandbox-persistent.sh is sourced via BASH_ENV by every bash
        # session (including the agent's), so package-manager commands are
        # transparently routed through sfw. sfw execs the real package
        # manager binary from PATH, so there is no recursion through the
        # shell functions.
        - command:
            - sh
            - -c
            - |
              set -eu
              f=/etc/sandbox-persistent.sh
              touch "$f"
              if ! grep -q 'BEGIN sfw wrappers' "$f"; then
                cat >> "$f" <<'EOF'

              # BEGIN sfw wrappers (socket-firewall kit)
              export SFW_SKIP_UPDATE_CHECK=1
              npm()   { sfw npm "$@"; }
              npx()   { sfw npx "$@"; }
              pnpm()  { sfw pnpm "$@"; }
              yarn()  { sfw yarn "$@"; }
              uv()    { sfw uv "$@"; }
              pip()   { sfw pip "$@"; }
              pip3()  { sfw pip3 "$@"; }
              cargo() { sfw cargo "$@"; }
              # go is deliberately not wrapped: sfw Free does not cover Go modules.
              # END sfw wrappers
              EOF
              fi
          user: "0"
          description: Route package managers through Socket Firewall via shell functions
